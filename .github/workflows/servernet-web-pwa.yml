name: ServerNet Studio web install build
on:
  push:
    branches: [develop]
    paths: ['servernet/web/**', 'servernet/extension/**', '.github/workflows/servernet-web-pwa.yml']
permissions:
  contents: read
jobs:
  pwa-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test && npm run build
        working-directory: servernet/web
      - name: Stage reviewed runtime files and record per-file SHA-256
        working-directory: servernet/web
        shell: bash
        run: |
          echo '### Runtime SHA-256 checksums' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/package-pwa.mjs "$RUNNER_TEMP/servernet-studio-pwa-dist" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload runtime-only web artifact
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: servernet-studio-pwa-dist
          path: ${{ runner.temp }}/servernet-studio-pwa-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Record artifact receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
        run: |
          printf 'Artifact ID: %s\nArchive SHA-256: %s\nSource commit: %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
