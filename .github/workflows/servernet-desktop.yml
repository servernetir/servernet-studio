name: ServerNet desktop packages
on:
  push:
    branches: [develop]
    paths: ['servernet/desktop/**', '.github/workflows/servernet-desktop.yml']
  pull_request:
    paths: ['servernet/desktop/**', '.github/workflows/servernet-desktop.yml']
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed release candidates after live acceptance
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - run: python -m pip install -r servernet/requirements-test.txt
      - run: python -m pytest -c servernet/pytest.ini servernet/tests -q
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: servernet/desktop
      - run: npm test
        working-directory: servernet/desktop
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: servernet/web
  packages:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: '--win --x64', name: windows-x64}
          - {os: macos-15-intel, target: '--mac --arm64 --x64', name: macos}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.signed && matrix.name == 'macos' && 60 || 30 }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: servernet/desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund
      - name: Check the connection dialog on Windows
        if: ${{ runner.os == 'Windows' }}
        run: npm exec -- electron scripts/connection-smoke.mjs
      - name: Unsigned validation packages
        if: ${{ !inputs.signed }}
        run: npm run build:test -- ${{ matrix.target }}
      - name: Write previously completed acceptance evidence
        if: ${{ inputs.signed }}
        shell: bash
        env:
          ACCEPTANCE_JSON: ${{ vars.SERVERNET_DESKTOP_ACCEPTANCE_JSON }}
        run: node -e "require('fs').writeFileSync('acceptance.json',process.env.ACCEPTANCE_JSON||'{}')"
      - name: Signed release candidates
        if: ${{ inputs.signed }}
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.SERVERNET_MAC_CSC_LINK || secrets.SERVERNET_WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.SERVERNET_MAC_CSC_PASSWORD || secrets.SERVERNET_WIN_CSC_PASSWORD }}
          SERVERNET_WINDOWS_PUBLISHER: ${{ vars.SERVERNET_WINDOWS_PUBLISHER }}
          APPLE_ID: ${{ secrets.SERVERNET_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.SERVERNET_APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.SERVERNET_APPLE_TEAM_ID }}
        run: npm run release:check && npm run build:release -- ${{ matrix.target }}
      - name: Verify native code signatures and notarization
        if: ${{ inputs.signed && runner.os == 'macOS' }}
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' bundle; do
            found=1
            /usr/bin/codesign --verify --deep --strict "$bundle"
            /usr/bin/xcrun stapler validate "$bundle"
            /usr/sbin/spctl --assess --type execute "$bundle"
          done < <(find release -maxdepth 3 -name '*.app' -print0)
          test "$found" = 1
          for image in release/*.dmg; do /usr/bin/codesign --verify --strict "$image"; done
      - name: Verify Windows signatures
        if: ${{ inputs.signed && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -Filter '*.exe') + @(Get-ChildItem release/win-unpacked -Filter '*.exe')
          if ($files.Count -lt 2) { throw 'Missing signed application or installer' }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid') { throw "Invalid signature: $($file.Name)" }
            if ($sig.SignerCertificate.Subject -notlike "*CN=$env:SERVERNET_WINDOWS_PUBLISHER,*" -and $sig.SignerCertificate.Subject -ne "CN=$env:SERVERNET_WINDOWS_PUBLISHER") { throw 'Unexpected signing identity' }
          }
        env:
          SERVERNET_WINDOWS_PUBLISHER: ${{ vars.SERVERNET_WINDOWS_PUBLISHER }}
      - name: Notarize and verify final Mac disk images and updater bytes
        if: ${{ inputs.signed && runner.os == 'macOS' }}
        env:
          APPLE_ID: ${{ secrets.SERVERNET_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.SERVERNET_APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.SERVERNET_APPLE_TEAM_ID }}
        run: npm run release:finalize
      - name: Verify final Windows updater bytes
        if: ${{ inputs.signed && runner.os == 'Windows' }}
        run: npm run release:finalize
      - name: Launch packaged client on its native OS
        if: ${{ runner.os == 'Windows' }}
        run: node scripts/native-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: servernet-${{ matrix.name }}-${{ inputs.signed && 'signed-candidate' || 'UNSIGNED-TEST' }}
          path: |
            servernet/desktop/release/*.exe
            servernet/desktop/release/*.dmg
            servernet/desktop/release/*.zip
            servernet/desktop/release/*.blockmap
            servernet/desktop/release/latest*.yml
            servernet/desktop/release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
  native-mac:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, arch: arm64, directory: mac-arm64}
          - {os: macos-15-intel, arch: x64, directory: mac}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: servernet/desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: servernet-macos-${{ inputs.signed && 'signed-candidate' || 'UNSIGNED-TEST' }}
          path: servernet/desktop/downloaded
      - name: Extract the matching package from this run
        shell: bash
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
          SIGNED: ${{ inputs.signed || false }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          prefix=ServerNet-Studio
          if [ "$SIGNED" != true ]; then prefix=ServerNet-Studio-UNSIGNED-TEST; fi
          package="downloaded/$prefix-$version-mac-$NATIVE_ARCH.zip"
          test -f "$package"
          /usr/bin/unzip -tq "$package"
          mkdir -p "release/$PACKAGE_DIRECTORY"
          /usr/bin/ditto -x -k "$package" "release/$PACKAGE_DIRECTORY"
      - name: Verify extracted signed application
        if: ${{ inputs.signed }}
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        run: |
          bundle="release/$PACKAGE_DIRECTORY/ServerNet Studio.app"
          /usr/bin/codesign --verify --deep --strict "$bundle"
          /usr/bin/xcrun stapler validate "$bundle"
          /usr/sbin/spctl --assess --type execute "$bundle"
      - name: Launch the actual architecture package
        env:
          SERVERNET_NATIVE_ARCH: ${{ matrix.arch }}
        run: node scripts/native-smoke.mjs
